name: CISA news bot

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min, off the busy top-of-hour slot (GitHub may still skip some runs)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # to commit state.json (what's already been posted)

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest state.json, not the (possibly older) commit that queued this run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post new items to Discord
        env:
          WEBHOOK_HACKTUALITY: ${{ secrets.WEBHOOK_HACKTUALITY }}
          WEBHOOK_CVE_ALERTS: ${{ secrets.WEBHOOK_CVE_ALERTS }}
          WEBHOOK_BREACHES: ${{ secrets.WEBHOOK_BREACHES }}
          WEBHOOK_CTF: ${{ secrets.WEBHOOK_CTF }}
        run: python3 news_bot.py

      - name: Save posted-items state
        if: success() || failure()   # save even if one channel failed, so others don't repeat
        run: |
          git config user.name "cisa-news-bot"
          git config user.email "cisa-news-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "news-bot: update state [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push
